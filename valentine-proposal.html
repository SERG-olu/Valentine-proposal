<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💝 Will You Be My Valentine? 💝</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Floating hearts animation */
        .heart-bg {
            position: absolute;
            font-size: 30px;
            opacity: 0.3;
            animation: float 15s infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.3;
            }
            90% {
                opacity: 0.3;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 60px 40px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 90%;
            position: relative;
            z-index: 10;
        }

        .proposal-content {
            display: block;
        }

        .celebration-content {
            display: none;
        }

        h1 {
            font-size: 2.5em;
            color: #e91e63;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .heart-emoji {
            font-size: 80px;
            margin: 20px 0;
            animation: heartbeat 1.5s infinite;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }
            25% {
                transform: scale(1.1);
            }
            50% {
                transform: scale(1);
            }
        }

        p {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .button-container {
            display: flex;
            gap: 30px;
            justify-content: center;
            align-items: center;
            margin-top: 30px;
            position: relative;
            min-height: 120px;
        }

        button {
            padding: 18px 50px;
            font-size: 1.3em;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .yes-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            transform: scale(1);
        }

        .yes-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.4);
        }

        .yes-btn:active {
            transform: scale(0.95);
        }

        .no-btn {
            background: #000;
            color: white;
            position: fixed;
            padding: 9px 25px;
            font-size: 0.65em;
            transition: all 0.2s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
        }

        .no-btn:hover {
            transform: scale(1.05);
        }

        .footer-text {
            margin-top: 40px;
            font-size: 1em;
            color: #000;
            font-style: italic;
            font-weight: bold;
        }

        /* Celebration styles */
        .celebration-gif {
            max-width: 100%;
            height: auto;
            border-radius: 20px;
            margin: 30px 0;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .celebration-text {
            font-size: 2em;
            color: #e91e63;
            font-weight: bold;
            margin: 20px 0;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #f093fb;
            position: absolute;
            animation: confetti-fall 3s linear infinite;
        }

        @keyframes confetti-fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <!-- Floating hearts background -->
    <div class="heart-bg" style="left: 10%; animation-delay: 0s;">❤️</div>
    <div class="heart-bg" style="left: 20%; animation-delay: 2s;">💕</div>
    <div class="heart-bg" style="left: 30%; animation-delay: 4s;">💖</div>
    <div class="heart-bg" style="left: 40%; animation-delay: 1s;">💗</div>
    <div class="heart-bg" style="left: 50%; animation-delay: 3s;">💝</div>
    <div class="heart-bg" style="left: 60%; animation-delay: 5s;">💘</div>
    <div class="heart-bg" style="left: 70%; animation-delay: 2.5s;">❤️</div>
    <div class="heart-bg" style="left: 80%; animation-delay: 4.5s;">💕</div>
    <div class="heart-bg" style="left: 90%; animation-delay: 1.5s;">💖</div>

    <div class="container">
        <div class="proposal-content" id="proposalContent">
            <h1>💝 Will You Be My Valentine? 💝</h1>
            <div class="heart-emoji">🧸</div>
            
            <div class="button-container" id="buttonContainer">
                <button class="yes-btn" id="yesBtn">Yes! 💕</button>
                <button class="no-btn" id="noBtn">No</button>
            </div>
            
            <p class="footer-text"><strong>The "No" button is a bit shy 🤦🏾‍♂️</strong></p>
        </div>

        <div class="celebration-content" id="celebrationContent">
            <h1>🎉 YAY! 🎉</h1>
            <p class="celebration-text">I knew you'd say yes! ❤️</p>
            <img src="https://media.giphy.com/media/g9582DNuQppxC/giphy.gif" alt="Celebration" class="celebration-gif">
            <p style="font-size: 1.2em; color: #666; margin-top: 20px;">That's my girl! 😘</p>
        </div>
    </div>

    <script>
        // ===== CUSTOMIZE YOUR PROPOSAL HERE =====
        const valentineName = ""; // Change this to your Valentine's name!
        // ========================================

        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const buttonContainer = document.getElementById('buttonContainer');
        const proposalContent = document.getElementById('proposalContent');
        const celebrationContent = document.getElementById('celebrationContent');

        // Update the title with the custom name
        document.querySelector('h1').textContent = valentineName 
            ? `💝 ${valentineName}, Will You Be My Valentine? 💝`
            : `💝 Will You Be My Valentine? 💝`;

        // Function to move the No button
        function moveNoButton() {
            // Get viewport dimensions
            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight;
            const btnRect = noBtn.getBoundingClientRect();
            
            // Calculate maximum positions to keep button within viewport
            const maxX = viewportWidth - btnRect.width - 20; // 20px margin
            const maxY = viewportHeight - btnRect.height - 20; // 20px margin
            
            // Generate random positions anywhere on the page
            const randomX = Math.random() * maxX;
            const randomY = Math.random() * maxY;
            
            // Apply new position
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        // Move button on hover
        noBtn.addEventListener('mouseenter', moveNoButton);
        
        // For mobile - move on touch
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveNoButton();
        });

        // Handle Yes button click
        yesBtn.addEventListener('click', () => {
            proposalContent.style.display = 'none';
            celebrationContent.style.display = 'block';
            noBtn.style.display = 'none'; // Hide the No button when Yes is clicked
            
            // Create confetti effect
            createConfetti();
        });

        // Create confetti animation
        function createConfetti() {
            const colors = ['#f093fb', '#f5576c', '#4facfe', '#00f2fe', '#ffd89b', '#19d38e'];
            const confettiCount = 50;
            
            for (let i = 0; i < confettiCount; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDelay = Math.random() * 3 + 's';
                    confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
                    document.body.appendChild(confetti);
                    
                    // Remove confetti after animation
                    setTimeout(() => confetti.remove(), 5000);
                }, i * 30);
            }
        }

        // Initial position for No button
        window.addEventListener('load', () => {
            // Start with No button in a visible position on the page
            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight;
            noBtn.style.left = (viewportWidth / 2 + 150) + 'px';
            noBtn.style.top = (viewportHeight / 2) + 'px';
        });
    </script>
</body>
</html>
